name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Sparse + blobless checkout: the repo carries ~800 MB of result figures,
      # the tests only need the code and the committed DeLong probabilities.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            src/utils
            tests
            outputs/results/delong
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest tests -v
